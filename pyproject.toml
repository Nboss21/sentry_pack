[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrypack"
version = "0.1.0"
description = "Modular Penetration Testing & Vulnerability Assessment Platform"
readme = "README.md"
authors = [
    { name = "SentryPack Team" }
]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "PyQt6>=6.5.0",
    "requests>=2.31.0",
    "websockets>=11.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
    "pre-commit>=3.3.0",
]

[project.scripts]
sentrypack = "scripts.validate_module:main"

[tool.setuptools.packages.find]
where = ["."]
