[transport]
id = "tls"
name = "TLS Encrypted Transport"
type = "transport"
version = "0.1.0"
description = "TLS/SSL encrypted socket transport for secure C2 sessions. Supports client-side certificates, CA verification, and configurable cipher selection."
author = "SentryPack"

[[options]]
name = "host"
type = "string"
description = "Remote host IP address or hostname to connect to"
required = true

[[options]]
name = "port"
type = "integer"
description = "Remote port number (default 4443)"
required = true
default = 4443

[[options]]
name = "certfile"
type = "file_path"
description = "Path to the client certificate file (PEM format). Optional for server-auth only mode."
required = false

[[options]]
name = "keyfile"
type = "file_path"
description = "Path to the private key file (PEM format). Required if certfile is specified."
required = false

[[options]]
name = "ca_certs"
type = "file_path"
description = "Path to CA certificate bundle (PEM) for server certificate verification."
required = false

[[options]]
name = "verify_cert"
type = "boolean"
description = "Whether to verify the remote server certificate. Set false only for testing with self-signed certs."
required = false
default = true

[[options]]
name = "server_hostname"
type = "string"
description = "Explicit server hostname for SNI and certificate CN verification. Defaults to 'host' if not set."
required = false

[[options]]
name = "timeout"
type = "integer"
description = "Socket connection timeout in seconds."
required = false
default = 10
